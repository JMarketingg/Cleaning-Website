<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TidyHaus Cleaner App</title>
<link rel="icon" href="/favicon-tech.svg">
<meta name="theme-color" content="#1f3a3d">
<style>
  :root { --bg:#f4f6f5; --panel:#fff; --ink:#18201e; --mute:#64706c; --line:#e1e6e3; --brand:#1f3a3d; --accent:#e8a33d; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111514; --panel:#1a201f; --ink:#e8edeb; --mute:#9aa6a2; --line:#2a3331; --brand:#9fd3cf; --ok:#4ade80; --err:#f87171; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; z-index:2; }
  @media (prefers-color-scheme: dark) { header { color:#0d1312; } }
  header h1 { font-size:18px; margin:0; }
  header button { background:transparent; border:1px solid currentColor; color:inherit; border-radius:8px; padding:6px 10px; font:inherit; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:17px; margin:0 0 4px; }
  .mute { color:var(--mute); font-size:14px; }
  label { display:block; font-size:14px; color:var(--mute); margin:10px 0 4px; }
  input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:inherit; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px; font:inherit; font-weight:700; background:var(--brand); color:#fff; margin-top:10px; text-align:center; text-decoration:none; }
  @media (prefers-color-scheme: dark) { .btn { color:#0d1312; } }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn.ok { background:var(--ok); color:#fff; }
  .btn:disabled { opacity:.5; }
  .err { color:var(--err); font-size:14px; min-height:18px; margin-top:8px; }
  .day { font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:18px 0 8px; }
  .job { display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
  .pill.done { color:var(--ok); }
  .lines div { display:flex; justify-content:space-between; font-size:15px; padding:3px 0; }
  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .photos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
  .tabs { display:flex; gap:6px; margin-bottom:6px; }
  .tabs button { flex:1; font:inherit; font-size:14px; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:inherit; }
  .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><h1>TidyHaus Cleaner</h1><button id="logout" hidden>Log out</button></header>
<main>
  <section id="login" hidden>
    <form class="card" id="loginForm">
      <h2>Sign in</h2>
      <p class="mute">Use the mobile number and 4-digit PIN the office gave you.</p>
      <label for="phone">Mobile number</label><input id="phone" type="tel" autocomplete="tel" placeholder="0917 123 4567">
      <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>
  <section id="list" hidden>
    <div class="tabs"><button data-r="today" class="on">Today</button><button data-r="week">Next 7 days</button></div>
    <div id="jobs"></div>
  </section>
  <section id="detail" hidden></section>
</main>
<script>
(function(){
  var API='/api/tech';
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
  var token=ls('th_cleaner_token')||'';
  var range='today';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function peso(n){ return '₱'+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-PH'); }
  function today(off){ return new Date(Date.now()+(off||0)*86400000).toLocaleDateString('en-CA',{timeZone:'Asia/Manila'}); }
  function show(id){ ['login','list','detail'].forEach(function(s){ document.getElementById(s).hidden = s!==id; }); document.getElementById('logout').hidden = id==='login'; }
  function api(action, o){
    o=o||{}; var url=new URL(API, location.origin); url.searchParams.set('action',action);
    Object.keys(o.params||{}).forEach(function(k){ url.searchParams.set(k,o.params[k]); });
    return fetch(url,{ method:o.method||'GET', headers:Object.assign({'Content-Type':'application/json'}, token?{Authorization:'Bearer '+token}:{}), body:o.body?JSON.stringify(o.body):undefined })
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){
        if(r.status===401 && action!=='login'){ logout(); throw new Error('Please sign in again.'); }
        if(!r.ok) throw new Error(d.error||'Something went wrong.'); return d; }); });
  }
  function logout(){ token=''; ls('th_cleaner_token',null); show('login'); }
  document.getElementById('logout').onclick=logout;

  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=document.getElementById('loginErr'); err.textContent='';
    var phone=document.getElementById('phone').value.replace(/[\s()-]/g,'').replace(/^0/,'+63');
    api('login',{method:'POST',body:{phone:phone,pin:document.getElementById('pin').value.trim()}})
      .then(function(d){ token=d.token; ls('th_cleaner_token',token); loadList(); })
      .catch(function(x){ err.textContent=x.message; });
  });

  document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){
    range=b.dataset.r; document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on',x===b); }); loadList(); }; });

  function loadList(){
    show('list'); var box=document.getElementById('jobs'); box.innerHTML='<p class="mute">Loading…</p>';
    api('jobs',{params:{from:today(0), to:range==='today'?today(0):today(6)}}).then(function(d){
      var jobs=d.jobs||[];
      if(!jobs.length){ box.innerHTML='<div class="card"><h2>No cleanings '+(range==='today'?'today':'this week')+'</h2><p class="mute">New jobs from the office show up here.</p></div>'; return; }
      var html='', last='';
      jobs.forEach(function(j){
        if(j.local_date!==last){ last=j.local_date; html+='<div class="day">'+esc(new Date(j.local_date+'T00:00:00').toLocaleDateString('en-PH',{weekday:'long',month:'short',day:'numeric'}))+'</div>'; }
        var done=j.status==='completed';
        html+='<button class="card job" data-id="'+esc(j.id)+'"><h2>'+esc(j.slot_time||'')+' · '+esc(j.customer_name)+'</h2>'+
          '<div class="mute">'+esc(j.service||'Cleaning')+'</div><div class="mute">'+esc(j.address||'No address yet')+'</div>'+
          '<span class="pill'+(done?' done':'')+'">'+esc(done?'Done':j.status==='on_the_way'?'On the way':'Scheduled')+'</span></button>';
      });
      box.innerHTML=html;
      box.querySelectorAll('[data-id]').forEach(function(b){ b.onclick=function(){ openJob(b.dataset.id); }; });
    }).catch(function(x){ box.innerHTML='<p class="err">'+esc(x.message)+'</p>'; });
  }

  function shrink(file){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ var m=1600, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82)); };
      img.onerror=function(){ rej(new Error('Could not read that photo.')); }; img.src=url;
    });
  }

  function openJob(id){
    show('detail'); var box=document.getElementById('detail'); box.innerHTML='<p class="mute">Loading…</p>';
    Promise.all([api('job',{params:{id:id}}), api('job_photos',{params:{id:id}}).catch(function(){ return {photos:[]}; })]).then(function(r){
      var j=r[0].job, photos=r[1].photos||[], done=j.status==='completed';
      var lines=(j.line_items||[]).map(function(l){ return '<div><span>'+esc(l.name)+(Number(l.quantity)>1?' × '+esc(l.quantity):'')+'</span><span>'+(l.line_total!=null?peso(l.line_total):'')+'</span></div>'; }).join('');
      box.innerHTML='<button class="btn ghost" id="back">← My jobs</button>'+
        '<div class="card"><h2>'+esc(j.customer_name)+'</h2><div class="mute">'+esc(j.service||'Cleaning')+'</div>'+
        '<p>'+esc(j.address||'No address yet. Call the customer.')+'</p>'+
        (j.maps_url?'<a class="btn ghost" href="'+esc(j.maps_url)+'" target="_blank" rel="noopener">Open in Maps</a>':'')+
        (j.customer_phone?'<a class="btn ghost" href="tel:'+esc(j.customer_phone)+'">Call '+esc(j.customer_phone)+'</a>':'')+'</div>'+
        ((j.notes||j.customer_notes)?'<div class="card"><h2>Notes</h2><p style="white-space:pre-wrap;margin:0;">'+esc([j.customer_notes,j.notes].filter(Boolean).join('\n'))+'</p></div>':'')+
        (lines?'<div class="card"><h2>What to clean</h2><div class="lines">'+lines+'</div>'+(j.price!=null?'<div class="lines" style="font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:6px;"><div><span>Total</span><span>'+peso(j.price)+'</span></div></div>':'')+'</div>':'')+
        '<div class="card"><h2>Photos</h2><p class="mute">Take a before and an after photo. You need at least 2 to finish.</p>'+
        '<div class="photos">'+photos.map(function(p){ return '<img src="'+esc(p.url)+'" alt="Job photo">'; }).join('')+'</div>'+
        (done?'':'<label class="btn ghost" style="margin-top:10px;">Add photo<input type="file" accept="image/*" capture="environment" id="ph" hidden></label>')+'</div>'+
        (done?'<div class="card"><h2>✓ Done</h2><p class="mute">Thanks! This cleaning is finished.</p></div>':
          (j.status!=='on_the_way'?'<button class="btn" id="otw">I\'m on my way</button>':'')+'<button class="btn ok" id="fin">Cleaning finished</button>')+
        '<div class="err" id="jErr"></div>';
      var err=document.getElementById('jErr');
      document.getElementById('back').onclick=loadList;
      var ph=document.getElementById('ph');
      if(ph) ph.onchange=function(){ var f=ph.files[0]; if(!f) return; err.textContent='Uploading…';
        shrink(f).then(function(img){ return api('job_photo_add',{method:'POST',body:{id:id,image:img}}); })
          .then(function(){ openJob(id); }).catch(function(x){ err.textContent=x.message; }); };
      function setStatus(s,btn){ btn.disabled=true; err.textContent='';
        api('status',{method:'POST',body:{id:id,status:s}}).then(function(){ openJob(id); }).catch(function(x){ btn.disabled=false; err.textContent=x.message; }); }
      var otw=document.getElementById('otw'); if(otw) otw.onclick=function(){ setStatus('on_the_way',otw); };
      var fin=document.getElementById('fin'); if(fin) fin.onclick=function(){ setStatus('completed',fin); };
    }).catch(function(x){ box.innerHTML='<button class="btn ghost" onclick="location.reload()">← Back</button><p class="err">'+esc(x.message)+'</p>'; });
  }

  if(token) loadList(); else show('login');
})();
</script>
</body>
</html>
